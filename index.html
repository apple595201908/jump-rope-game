<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8bd7ee" />
    <meta name="description" content="點一下跳起來，別讓跳繩打到腳。" />
    <title>芳翊玩跳繩</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f9d54a'/%3E%3Cpath d='M12 35c0 18 40 18 40 0' fill='none' stroke='%23a73430' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23243642'/%3E%3Ccircle cx='44' cy='20' r='6' fill='%23243642'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="./assets/character.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="game" class="game" aria-label="跳繩遊戲區">
      <canvas id="gameCanvas" aria-hidden="true"></canvas>

      <header class="hud" id="hud" aria-hidden="true">
        <div class="score-wrap">
          <span class="hud-label">JUMP</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-best">BEST <strong id="playBest">0</strong></div>
      </header>

      <button id="soundButton" class="sound-button" type="button" aria-pressed="true" aria-label="關閉遊戲音效">
        <span id="soundIcon" aria-hidden="true">♪</span><span id="soundText">聲音 開</span>
      </button>

      <div id="timing" class="timing" aria-live="polite"></div>
      <div id="ready" class="ready" aria-live="assertive"></div>
      <div id="impact" class="impact" aria-hidden="true"></div>

      <section id="startScreen" class="screen start-screen">
        <div class="title-lockup">
          <p class="eyebrow">ONE TAP JUMP ROPE</p>
          <h1><span>芳翊玩</span>跳繩</h1>
        </div>
        <img class="start-character" src="./assets/character.png" alt="準備跳繩的角色" />
        <div class="start-card">
          <div class="best-card">BEST <strong id="startBest">0</strong></div>
          <p>點一下跳起來<br />不要被繩子打到</p>
          <button id="startButton" class="primary-button" type="button">START</button>
        </div>
      </section>

      <section id="resultScreen" class="screen result-screen" hidden>
        <div class="result-card">
          <p class="game-over">GAME OVER</p>
          <div id="newRecord" class="new-record" hidden>NEW RECORD!</div>
          <div class="result-score">
            <span>本局跳了</span>
            <strong id="resultScore">0</strong>
            <span>下</span>
          </div>
          <p class="result-best">BEST <strong id="resultBest">0</strong></p>
          <div id="stats" class="stats" aria-label="本局判定統計"></div>
          <p id="comment" class="comment"></p>
          <button id="retryButton" class="primary-button retry-button" type="button">再來一次</button>
        </div>
      </section>

      <p id="tapHint" class="tap-hint" hidden>畫面任意處點一下跳躍</p>
      <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    </main>
    <script src="./game.js" defer></script>
  </body>
</html>
